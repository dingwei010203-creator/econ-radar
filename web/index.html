<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Econ Radar · 私人专业工作台</title><link rel="stylesheet" href="jobs.css"><script src="reference-data.js" defer></script><script src="conference-data.js" defer></script><script src="core.js" defer></script><script src="jobs.js" defer></script></head>
<body>
<aside class="sidebar"><a class="brand" href="index.html"><span class="brandmark">e.</span><span>ECON RADAR<small>经济学人的工作台</small></span></a><div class="section-label">我的空间</div><nav aria-label="主导航"><button data-tab="overview" class="active">◈　我的日程</button><button data-tab="consultations">◷　咨询记录</button><button data-tab="conferences">↗　会议信息</button><button data-tab="jobs">▤　我的投递 <span id="job-count">0</span></button><button data-tab="feed">◎　招聘线索 <span id="feed-count">0</span></button><button data-tab="references">▧　历史参考库</button><button data-tab="resources">▱　模板与经验</button><button data-tab="settings">⚙　来源与备份</button></nav><div class="sidebar-foot"><span class="dot"></span> 私人使用版本<p>你的日程与记录保存在本浏览器。<br>换设备前，请导出备份。</p><button id="side-backup" class="subtle">导出我的备份 ↗</button></div></aside>
<main><header><div><div class="eyebrow" id="today"></div><h1 id="page-title">求职概览</h1><p id="page-subtitle">把机会、准备与下一步，放在同一处。</p></div><button class="primary" id="add-job">＋ 新建申请</button></header>
<div id="storage-warning" class="notice danger" hidden></div><div id="mode-note" class="notice"></div><div id="main-content"></div><footer>历史附件只提供线索；招聘条件与截止日期以你核实后的原文为准。个人记录不会自动发送给任何学校。</footer></main>
<dialog id="editor"><form id="job-form"><div class="dialog-head"><div><div class="eyebrow">APPLICATION</div><h2 id="editor-title">新建申请</h2></div><button type="button" data-close aria-label="关闭">✕</button></div><input type="hidden" name="id"><div class="form-grid">
<label>学校 / 机构 *<input name="school" required maxlength="300"></label><label>学院 / 部门<input name="department" maxlength="300"></label><label>岗位<input name="role" placeholder="助理教授、讲师、博士后…"></label><label>城市<input name="city"></label><label>研究方向<input name="field"></label><label>优先级<select name="priority"><option>普通</option><option>优先</option><option>备选</option></select></label><label class="wide">招聘原文链接<input name="url" type="url" placeholder="https://…"></label><label>投递截止日期<input name="deadline" type="date"></label><label>投递阶段<select name="stage" id="stage-options"></select></label><label>投递日期<input name="appliedAt" type="date"></label><label>面试 / Job talk 日期<input name="interviewAt" type="date"></label><label>下次跟进日期<input name="followupAt" type="date"></label><label>推荐信截止日期<input name="referenceDue" type="date"></label><label>推荐信提交方式<select name="referenceMethod"><option>未确认</option><option>推荐人邮件发送</option><option>AEA 系统</option><option>学校系统</option><option>本人提交</option><option>无需推荐信</option></select></label><label>推荐信状态<select name="referenceState"><option>未联系</option><option>已联系</option><option>待发送</option><option>已完成</option></select></label>
<fieldset class="wide"><legend>已准备的材料</legend><div id="material-options" class="checks"></div></fieldset><label class="wide check"><input name="verified" type="checkbox">我已打开招聘原文，核实此岗位与填写的日期</label><label class="wide">私人备注 / 下一步<textarea name="notes" rows="4" placeholder="需要做什么、联系人、面试反馈…"></textarea></label><details class="wide"><summary>待遇与工作条件（填写已核实的信息）</summary><div class="form-grid"><label>待遇<input name="salary" placeholder="金额、税前税后、年份"></label><label>考核与聘期<input name="tenure"></label><label class="wide">教学和其他要求<input name="teaching"></label></div></details><input type="hidden" name="source"><div id="job-history" class="wide muted"></div></div><p id="form-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" id="delete-job" class="danger-text">删除申请</button><span class="spacer"></span><button type="button" data-close>取消</button><button class="primary" type="submit">保存申请</button></div></form></dialog>
<dialog id="detail"><div class="dialog-head"><h2>历史参考原文</h2><button data-close aria-label="关闭">✕</button></div><div id="detail-body"></div><div class="dialog-actions"><button data-close>关闭</button></div></dialog><input id="import-file" type="file" accept=".json,.csv" hidden><div id="toast" role="status" aria-live="polite"></div>
<dialog id="planner-editor"><form id="planner-form"><div class="dialog-head"><h2 id="planner-title">新建日程</h2><button type="button" data-close aria-label="关闭">✕</button></div><div id="planner-fields" class="form-grid"></div><p id="planner-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" id="planner-delete" class="danger-text">删除记录</button><span class="spacer"></span><button type="button" data-close>取消</button><button class="primary">保存</button></div></form></dialog></body></html>
